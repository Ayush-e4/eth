name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::.env file committed"; exit 1
          fi

      - name: Files stay under 300 lines
        run: ./scripts/check-file-length.sh

      - name: Lint workflows
        uses: raven-actions/actionlint@v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: foundry-rs/foundry-toolchain@v1

      - run: pnpm install --frozen-lockfile

      - name: Lint & format
        run: pnpm lint

      - name: Solidity format
        run: pnpm --filter @eth/contracts fmt:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Slither (static analysis)
        working-directory: packages/contracts
        run: pipx run --spec slither-analyzer==0.11.6 slither .
